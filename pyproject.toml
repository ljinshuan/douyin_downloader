[project]
name = "douyin-downloader"
version = "0.1.0"
description = "Douyin video auto-downloader via mitmproxy"
requires-python = ">=3.13"
dependencies = [
    "mitmproxy>=10.0",
    "aiohttp>=3.9",
    "pybloom-live>=4.0",
]

[project.scripts]
douyin-dl = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
